# =============================================================================
#  DELIBERATELY VULNERABLE APACHE CONFIGURATION  --  TRAINING LAB ONLY
#
#  Installed as /etc/httpd/conf.d/zz-slowloris-lab.conf on the victim node.
#  Because conf.d/*.conf is included at the very end of httpd.conf, everything
#  here wins over the distro defaults.
#
#  Every dangerous setting is annotated with the hardened equivalent, so this
#  file doubles as the "before" half of the before/after demo.
#
#  Why this is exploitable with Slowloris:
#    1. No request-read timeout  -> a client may dribble headers forever.
#    2. Small prefork worker pool -> the pool *is* the concurrency limit.
#    3. Huge KeepAliveTimeout    -> idle keep-alive sockets waste slots too.
# =============================================================================

ServerTokens Full
ServerSignature On

# --- Weakness 1: nothing reaps a slow client ---------------------------------
# Apache 2.4 loads mod_reqtimeout by default, and that module has a built-in
# default of:
#     RequestReadTimeout handshake=0 header=20-40,MinRate=500 body=20,MinRate=500
# which is already enough to 408 a naive slowloris after ~40 seconds.
# Setting header/body to 0 disables the protection completely.
#
# HARDENING: remove this block, or set header=20-40,MinRate=500 body=20,MinRate=500
<IfModule mod_reqtimeout.c>
    RequestReadTimeout header=0 body=0
</IfModule>

# Idle sockets are never reaped.
Timeout 300

# --- Weakness 2: keep-alive sockets hold slots for 5 minutes -----------------
KeepAlive On
MaxKeepAliveRequests 0
KeepAliveTimeout 300

# --- Weakness 3: tiny prefork worker pool ------------------------------------
# Prefork is one process per connection, so MaxRequestWorkers is a hard cap on
# how many requests can be in flight. 40 is deliberately small: it keeps a
# t3.micro from swapping to death and keeps the Grafana graph readable.
# The mechanism is identical at 4000. HARDENING: raise the pool *and* fix (1).
<IfModule mpm_prefork_module>
    StartServers             4
    MinSpareServers          4
    MaxSpareServers          8
    ServerLimit             40
    MaxRequestWorkers       40
    MaxConnectionsPerChild   0
</IfModule>

# --- mod_status: the source of the live connection counts --------------------
# apache_exporter scrapes http://127.0.0.1/server-status?auto
ExtendedStatus On
<Location "/server-status">
    SetHandler server-status
    Require local
</Location>
