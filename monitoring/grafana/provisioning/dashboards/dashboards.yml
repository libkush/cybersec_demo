# Tells Grafana to load every dashboard JSON found in the mounted directory.
apiVersion: 1

providers:
  - name: lab
    orgId: 1
    folder: "DDoS Lab"
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
